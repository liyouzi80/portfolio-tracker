name: Deploy Worker

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --legacy-peer-deps

      - name: Inject Cloudflare resource IDs
        run: |
          sed -i "s/PLACEHOLDER_D1_ID/${{ secrets.CF_D1_DATABASE_ID }}/g" wrangler.toml

      - run: npx @opennextjs/cloudflare build

      # Deploy and inject Worker secrets. Values come from GitHub repository
      # secrets (Settings → Secrets and variables → Actions).
      # Longbridge secrets are optional — omit them to use Yahoo Finance only.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
          secrets: |
            JWT_SECRET
            LONGBRIDGE_APP_KEY
            LONGBRIDGE_APP_SECRET
            LONGBRIDGE_ACCESS_TOKEN
            FINNHUB_API_KEY
            CRON_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
