name: Deploy Worker

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --legacy-peer-deps

      - run: npx @opennextjs/cloudflare build

      # Deploy the Worker. JWT_SECRET is injected as a Worker secret via the
      # 'secrets' input (only set if the GitHub secret is non-empty).
      # Longbridge credentials are configured in-app and stored in D1 — no
      # need to pass them here.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
          secrets: |
            JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
