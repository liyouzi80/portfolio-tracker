name: Deploy Worker

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --legacy-peer-deps

      - run: npx @opennextjs/cloudflare build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      # Set Worker secrets individually — only if the secret is non-empty.
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
        run: |
          set_secret() {
            local name=$1
            local value=$2
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$name"
            fi
          }
          set_secret JWT_SECRET             "$JWT_SECRET"
          set_secret LONGBRIDGE_APP_KEY     "$LONGBRIDGE_APP_KEY"
          set_secret LONGBRIDGE_APP_SECRET  "$LONGBRIDGE_APP_SECRET"
          set_secret LONGBRIDGE_ACCESS_TOKEN "$LONGBRIDGE_ACCESS_TOKEN"
