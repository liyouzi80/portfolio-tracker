name: Cron Jobs

on:
  schedule:
    # Every 30 min: price fetch + alert check
    - cron: "*/30 * * * *"
    # Daily 08:00 UTC: snapshot
    - cron: "0 8 * * *"
    # Daily 06:30 UTC: exchange rates
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - price-fetch
          - snapshot
          - rates-fetch

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Price Fetch
        if: |
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'price-fetch'))
          || (github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *')
        run: |
          echo "Running price-fetch..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://${{ secrets.WORKER_HOST }}/api/cron/price-fetch?secret=${{ secrets.CRON_SECRET }}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep -oP 'HTTP_STATUS:\K\d+')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          echo "$BODY" | head -50
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Price-fetch failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Price-fetch completed"

      - name: Snapshot
        if: |
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'snapshot'))
          || (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *')
        run: |
          echo "Running snapshot..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://${{ secrets.WORKER_HOST }}/api/cron/snapshot?secret=${{ secrets.CRON_SECRET }}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep -oP 'HTTP_STATUS:\K\d+')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          echo "$BODY" | head -50
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Snapshot failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Snapshot completed"

      - name: Rates Fetch
        if: |
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'rates-fetch'))
          || (github.event_name == 'schedule' && github.event.schedule == '30 6 * * *')
        run: |
          echo "Running rates-fetch..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://${{ secrets.WORKER_HOST }}/api/cron/rates-fetch?secret=${{ secrets.CRON_SECRET }}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep -oP 'HTTP_STATUS:\K\d+')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          echo "$BODY" | head -50
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Rates-fetch failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Rates-fetch completed"
