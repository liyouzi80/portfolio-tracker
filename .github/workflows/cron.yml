name: Cron Jobs (Manual Only)

# Scheduled cron runs via Cloudflare Workers Cron Triggers (see wrangler.toml [triggers]).
# This workflow is kept for manual ad-hoc runs via workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - price-fetch
          - snapshot
          - rates-fetch

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Price Fetch
        if: github.event.inputs.job == 'all' || github.event.inputs.job == 'price-fetch'
        run: |
          echo "Running price-fetch..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://${{ secrets.WORKER_HOST }}/api/cron/price-fetch?secret=${{ secrets.CRON_SECRET }}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep -oP 'HTTP_STATUS:\K\d+')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          echo "$BODY" | head -50
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Price-fetch failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Price-fetch completed"

      - name: Snapshot
        if: github.event.inputs.job == 'all' || github.event.inputs.job == 'snapshot'
        run: |
          echo "Running snapshot..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://${{ secrets.WORKER_HOST }}/api/cron/snapshot?secret=${{ secrets.CRON_SECRET }}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep -oP 'HTTP_STATUS:\K\d+')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          echo "$BODY" | head -50
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Snapshot failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Snapshot completed"

      - name: Rates Fetch
        if: github.event.inputs.job == 'all' || github.event.inputs.job == 'rates-fetch'
        run: |
          echo "Running rates-fetch..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://${{ secrets.WORKER_HOST }}/api/cron/rates-fetch?secret=${{ secrets.CRON_SECRET }}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep -oP 'HTTP_STATUS:\K\d+')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          echo "$BODY" | head -50
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Rates-fetch failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Rates-fetch completed"
